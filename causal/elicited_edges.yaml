# Edges asserted by a human with domain knowledge of the NSW CTP scheme.
#
# This is the strongest evidence class in the project and the only one that is not machine
# generated. Statute is authoritative but reaches barely any of the constructed columns;
# reasoned priors are a language model's opinion, tested but still an opinion. A claim here
# is a person who knows the scheme saying how it works.
#
# RANK. elicited > statute > reasoned_prior_tested > reasoned_prior_path. Where an elicited
# edge contradicts a machine-derived one, the machine-derived one is dropped and the
# conflict recorded. Where a cycle must be broken, an elicited edge is the last to go.
#
# WHAT THIS IS NOT. It is not review of the whole graph. An edge absent from this file has
# not been rejected by anyone -- it has not been looked at. Do not read silence as approval.
#
# Each entry needs: source, target, who, when, and the stated mechanism in their words.
# `verbatim` is what they actually said, so a later reader can judge the paraphrase.

elicited_by: Colin Priest
project: causal-map-nsw-ctp

edges:
  - source: Liability Clarity
    target: Legal Procedural Complexity
    date: 2026-08-05
    mechanism: >-
      Whether liability is contested drives how heavily the claim is litigated. Disputed
      fault adds a limb of argument that clear fault does not.
    verbatim: "Whether liability is contested causes legal complexity"

  - source: Pre-existing Condition Salience
    target: Legal Procedural Complexity
    date: 2026-08-05
    mechanism: >-
      A prior condition to apportion against generates medical evidence and argument,
      making the proceeding heavier.
    verbatim: "Pre-existing Condition Salience causes legal complexity"

  - source: Causation Complexity
    target: Legal Procedural Complexity
    date: 2026-08-05
    mechanism: >-
      Contested causation is what generates the evidence and the interlocutory steps that
      procedural complexity records. The reverse direction, derived from a model's choice
      of mediator, is wrong.
    verbatim: "why aren't you allowing causation complexity to affect legal procedural complexity?"

  - source: Injury Burden Intensity
    target: Causation Complexity
    date: 2026-08-05
    mechanism: >-
      Causation complexity is the downstream result of weighing the accident's injuries
      against other explanations, so the physical injury picture is one of its inputs.
    verbatim: >-
      "Causation Complexity is the downstream result of the injuries from the accident
      versus pre-existing conditions. So it should be the result of the injury burden
      psych emphasis and pre-existing."

  - source: Psychological Injury Emphasis
    target: Causation Complexity
    date: 2026-08-05
    mechanism: >-
      The psychological component is weighed on the same question of what the accident
      caused, so it is an input to causation complexity.
    verbatim: >-
      "it should be the result of the injury burden psych emphasis and pre-existing"

  - source: Pre-existing Condition Salience
    target: Causation Complexity
    date: 2026-08-05
    mechanism: >-
      The prior condition is the alternative explanation being weighed against the
      accident, and is therefore the single biggest driver of causation difficulty.
    verbatim: >-
      "Causation Complexity is the downstream result of the injuries from the accident
      versus pre-existing conditions."

# ---------------------------------------------------------------------------------------
# Domain knowledge that is not an edge: how a head of damage is actually assessed. Recorded
# because it constrains which edges are admissible, and because it was checked against the
# data rather than taken on trust.
# ---------------------------------------------------------------------------------------
domain_notes:
  - subject: Future Economic Loss
    date: 2026-08-05
    claim: >-
      Future economic loss is assessed on the claimant's most likely future circumstances
      but for the injury, discounted for contingencies and to present value at the
      prescribed rate. Its quantum depends on vocational evidence, work history, age and
      retirement assumptions -- not on WPI %.
    consequence_for_the_graph: >-
      WPI % must not be given an edge to Future Economic Loss. The parents of that head are
      Claimant Weekly Income, Claimant Age and Work Impact Severity, which is what the graph
      has.
    checked_against_data: >-
      Above vs at-or-below the 10% threshold, mean log future economic loss is 10.58 against
      10.59, p = 0.99. Among claims already above the threshold, continuous WPI against log
      future economic loss is rho = 0.177 on n = 92. The threshold does nothing to this head.

  - subject: WPI % as an eligibility threshold, not a scale
    date: 2026-08-05
    claim: >-
      WPI is a medical model that does not measure earning capacity, treatment need or
      labour-market attachment. In practice it defines eligibility -- above 10% enables
      non-economic loss and longer weekly benefits -- rather than scaling any figure by a
      per-percent multiplier. Practitioners price by WPI band, anchoring on observed
      settlement ranges, not by multiplying a percentage.
    consequence_for_the_graph: >-
      The causal role of WPI % is the threshold crossing, recorded in ctp/columns.yaml as
      `operative_form`. Any estimate treating it as a continuous driver is answering a
      question the scheme does not pose.
    checked_against_data: >-
      Non-economic loss above vs at-or-below the threshold: mean log 12.33 against 0.70,
      p = 2.7e-93. The gate is essentially the entire effect.

  - subject: The award is a litigated outcome, not the output of a formula
    date: 2026-08-05
    claim: >-
      Statutory principles say how a head of damage OUGHT to be assessed. The figure this
      dataset records is what a proceeding actually produced -- shaped by legal costs, by
      negotiating position, and by a claimant compromising to reach a settlement. A
      contested matter and a straightforward one do not arrive at the same number even on
      identical facts, so how heavily a claim was litigated is a genuine cause of quantum.
    consequence_for_the_graph: >-
      Legal Procedural Complexity -> Future Economic Loss is admissible and must not be
      removed on the ground that the assessment principles do not name it. Nor may
      Psychological Injury Emphasis -> Non-Economic Loss be removed on the ground that the
      column measures discussion rather than injury: a court's decision is affected by what
      is argued in front of it, which is the whole point of a proceeding.
    why_this_is_recorded: >-
      Both edges were proposed for deletion on the same faulty reasoning -- that a variable
      the statute does not list as an input to the calculation cannot affect the outcome.
      The statute describes the calculation; the data records the litigation. Anything that
      moves a negotiated figure is in scope for a graph of decided claims.
