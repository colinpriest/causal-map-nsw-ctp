<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" width="1600" height="850" role="img" aria-label="How the NSW CTP causal graph is built: evidence classes, structural constraints, and coverage"><title>NSW CTP causal map — evidence and constraints</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker></defs><style>
    .bg{fill:#fcfcfb} .panel{fill:#ffffff;stroke:rgba(11,11,11,.12)}
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#0b0b0b}
    .h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
    .h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
    .lab{font-size:14.5px;font-weight:600}
    .sub{font-size:13px;fill:#52514e} .note{font-size:13px;fill:#52514e}
    .tiny{font-size:11.5px;fill:#6f6d68}
    .val{font-size:15px;font-weight:700;fill:#52514e}
    .big{font-size:38px;font-weight:700;letter-spacing:-.02em}
    .nodelab{font-size:13px;font-weight:600}
    .rule{stroke:rgba(11,11,11,.12)}
    .node{fill:#ffffff;stroke:rgba(11,11,11,.34);stroke-width:1.4}
    .node.latent{fill:none;stroke-dasharray:5 3;stroke-width:1.8}
    .arrow{stroke:#52514e;stroke-width:2;fill:none}
    .seg-forbidden{fill:#c9c7c1} .seg-empty{fill:#86b6ef} .seg-edge{fill:#104281}
    .b0{fill:#104281}.b1{fill:#1c5cab}.b2{fill:#2a78d6}.b3{fill:#5598e7}.b4{fill:#86b6ef}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d0d0d} .panel{fill:#1a1a19;stroke:rgba(255,255,255,.14)}
      text{fill:#ffffff} .sub,.note,.val{fill:#c3c2b7} .tiny{fill:#a8a69e}
      .rule{stroke:rgba(255,255,255,.14)}
      .node{fill:#1a1a19;stroke:rgba(255,255,255,.4)} .node.latent{fill:none}
      .arrow{stroke:#c3c2b7}
      .seg-forbidden{fill:#55534e} .seg-empty{fill:#256abf} .seg-edge{fill:#b7d3f6}
      .b0{fill:#b7d3f6}.b1{fill:#86b6ef}.b2{fill:#3987e5}.b3{fill:#256abf}.b4{fill:#184f95}
    }</style><rect class="bg" x="0" y="0" width="1600" height="850"/><text x="48" y="62" class="h1">Building a causal map of NSW CTP awards — with provenance</text><text x="48" y="90" class="sub">Every edge traces to something checkable. Edges without evidence are not drawn.</text><rect class="panel" x="48" y="122" width="700" height="470" rx="10"/><text x="70" y="154" class="h2">Edges by strongest evidence</text><text x="70" y="176" class="sub">34 edges. An edge with both a statute quote and a reasoned prior is counted under statute only.</text><text x="70" y="216" class="lab">Elicited</text><text x="70" y="232" class="tiny">A domain expert stated it, with mechanism and verbatim quote</text><rect class="bar b0" x="320" y="204" width="132.8" height="15" rx="4"/><rect class="bar b0" x="320" y="204" width="6.0" height="15"/><text x="465" y="216" class="val">6</text><text x="70" y="278" class="lab">Statute</text><text x="70" y="294" class="tiny">A provision quoted verbatim from primary legislation</text><rect class="bar b1" x="320" y="266" width="66.4" height="15" rx="4"/><rect class="bar b1" x="320" y="266" width="6.0" height="15"/><text x="398" y="278" class="val">3</text><text x="70" y="340" class="lab">Measurement</text><text x="70" y="356" class="tiny">An indicator and the latent quantity it traces</text><rect class="bar b2" x="320" y="328" width="22.1" height="15" rx="4"/><rect class="bar b2" x="320" y="328" width="6.0" height="15"/><text x="354" y="340" class="val">1</text><text x="70" y="402" class="lab">Reasoned prior (tested)</text><text x="70" y="418" class="tiny">Blind reasoning that passed a prediction fixed before the data was seen</text><rect class="bar b3" x="320" y="390" width="177.0" height="15" rx="4"/><rect class="bar b3" x="320" y="390" width="6.0" height="15"/><text x="509" y="402" class="val">8</text><text x="70" y="464" class="lab">Reasoned prior (path)</text><text x="70" y="480" class="tiny">A model named a mediator, nothing more</text><rect class="bar b4" x="320" y="452" width="354.0" height="15" rx="4"/><rect class="bar b4" x="320" y="452" width="6.0" height="15"/><text x="686" y="464" class="val">16</text><line class="rule" x1="70" y1="528" x2="726" y2="528"/><text x="70" y="560" class="note">The largest class is the weakest: 16 of 34 edges rest only on a model</text><text x="70" y="580" class="note">naming a mediator.</text><rect class="panel" x="772" y="122" width="780" height="200" rx="10"/><text x="794" y="154" class="h2">Chronology forbids more than evidence supplies</text><text x="794" y="176" class="sub">272 ordered pairs among the variables.</text><rect class="seg-forbidden" x="794.0" y="200" width="352.5" height="30" rx="4"/><rect class="seg-empty" x="1148.5" y="200" width="287.5" height="30" rx="4"/><rect class="seg-edge" x="1438.0" y="200" width="92.0" height="30" rx="4"/><rect class="seg-forbidden" x="794" y="247" width="10" height="10" rx="2"/><text x="810" y="256" class="tiny">forbidden — 131</text><rect class="seg-empty" x="1004" y="247" width="10" height="10" rx="2"/><text x="1020" y="256" class="tiny">permitted, no evidence — 107</text><rect class="seg-edge" x="1214" y="247" width="10" height="10" rx="2"/><text x="1230" y="256" class="tiny">evidenced — 34</text><text x="794" y="296" class="note">An effect cannot precede its cause. This rule needs no evidence and does more orientation</text><text x="794" y="314" class="note">work than every statistical signal combined.</text><rect class="panel" x="772" y="338" width="780" height="200" rx="10"/><text x="794" y="370" class="h2">A score cannot cause what it measures</text><rect class="node latent" x="798" y="406" width="196" height="48" rx="7"/><text x="896" y="426" class="nodelab" text-anchor="middle">Psychological Injury</text><text x="896" y="443" class="tiny" text-anchor="middle">latent — never observed</text><path class="arrow" d="M1002 430 L1053 430" marker-end="url(#arrowhead)"/><rect class="node" x="1064" y="406" width="212" height="48" rx="7"/><text x="1170" y="426" class="nodelab" text-anchor="middle">Psychological Injury Emphasis</text><text x="1170" y="443" class="tiny" text-anchor="middle">indicator — a recorded score</text><text x="798" y="494" class="note">An assessment score is caused by the state it scores. It cannot cause what that</text><text x="798" y="512" class="note">state causes. Like chronology, this rule needs no evidence — and it removed an edge</text><text x="798" y="530" class="note">a reasoned prior had asserted at 100% agreement.</text><rect class="panel" x="772.0" y="554" width="250.66666666666666" height="178" rx="10"/><text x="792" y="628" class="big">17</text><text x="792" y="654" class="lab">nodes</text><text x="792" y="678" class="tiny">1 latent, never observed</text><rect class="panel" x="1036.6666666666665" y="554" width="250.66666666666666" height="178" rx="10"/><text x="1057" y="628" class="big">34</text><text x="1057" y="654" class="lab">edges</text><text x="1057" y="678" class="tiny">effect estimated on 33</text><rect class="panel" x="1301.3333333333333" y="554" width="250.66666666666666" height="178" rx="10"/><text x="1321" y="628" class="big">6/11</text><text x="1321" y="654" class="lab">thresholds fragile</text><text x="1321" y="678" class="tiny">quote those results with the threshold</text><rect class="panel" x="48" y="608" width="700" height="124" rx="10"/><text x="70" y="640" class="h2">Sparse by construction</text><text x="70" y="664" class="note">Absence of an edge means no evidence was found — not that no relationship</text><text x="70" y="686" class="note">exists. 102 provisions were read blind; 5 produced a link with a verbatim quote.</text><line class="rule" x1="48" y1="770" x2="1552" y2="770"/><text x="48" y="796" class="tiny">Generated from causal/provenance/banded_graph.json by causal/stage16_render_infographic.py — no figure on this page is typed in.</text><text x="48" y="816" class="tiny">Graph assembled 2026-08-05T21:55:30+00:00. Re-run the stage to redraw.</text></svg>